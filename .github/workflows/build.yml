name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the GitHub release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  MODEL_RELEASE: "model-assets-v1"
  MODEL_BASE_URL: "https://github.com/Jesse-Phitidis/BirdWatcher/releases/download/model-assets-v1"

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH, optionally with a prerelease suffix: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner_os: Windows
            archive_extension: exe
          - os: macos-latest
            runner_os: macOS
            archive_extension: dmg
          - os: ubuntu-latest
            runner_os: Linux
            archive_extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          fi
          python -m pip install -r requirements-build.txt

      - name: Download model assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models

          for filename in \
            classifier_b1.onnx \
            classifier_b1.onnx.data \
            classifier_b128.onnx \
            classifier_b128.onnx.data \
            classifier_b32.onnx \
            classifier_b32.onnx.data \
            yolo26m_b1.onnx \
            yolo26m_b128.onnx \
            yolo26m_b32.onnx \
            yolo26x_b1.onnx \
            yolo26x_b128.onnx \
            yolo26x_b32.onnx; do
            curl --fail --location --retry 3 --output "assets/models/$filename" "$MODEL_BASE_URL/$filename"
          done

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            data_separator=';'
            icon_args=(--icon "assets/icons/icon.ico")
          elif [ "$RUNNER_OS" = "macOS" ]; then
            data_separator=':'
            icon_args=(--icon "assets/icons/icon.icns")
          else
            data_separator=':'
            icon_args=()
          fi

          pyinstaller \
            --name BirdWatcher \
            "${icon_args[@]}" \
            --windowed \
            --add-data "assets${data_separator}assets" \
            --collect-all onnxruntime \
            birdwatcher/app.py

      - name: Package application
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          PLATFORM_NAME: ${{ matrix.runner_os }}
          ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
        run: |
          set -euo pipefail
          archive="BirdWatcher-${PLATFORM_NAME}-${RUNNER_ARCH}-${RELEASE_TAG}.${ARCHIVE_EXTENSION}"
          
          # ==========================================
          # macOS Packaging (DMG)
          # ==========================================
          if [ "$RUNNER_OS" = "macOS" ]; then
            source="dist/BirdWatcher.app"
            if [ ! -d "$source" ]; then
              echo "PyInstaller macOS app bundle not found: $source" >&2
              exit 1
            fi
            
            brew install create-dmg
            
            create-dmg \
              --volname "BirdWatcher Installer" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "BirdWatcher.app" 150 190 \
              --hide-extension "BirdWatcher.app" \
              --app-drop-link 450 190 \
              "$archive" \
              "$source"
              
            exit 0
          fi

          # ==========================================
          # Linux Packaging (TAR.GZ)
          # ==========================================
          if [ "$RUNNER_OS" = "Linux" ]; then
            source="dist/BirdWatcher/BirdWatcher"
            if [ ! -f "$source" ]; then
              echo "PyInstaller Linux executable not found: $source" >&2
              exit 1
            fi
            tar -czf "$archive" -C dist BirdWatcher
            exit 0
          fi

          # ==========================================
          # Windows Packaging (Inno Setup Installer)
          # ==========================================
          if [ "$RUNNER_OS" = "Windows" ]; then
            executable="dist/BirdWatcher/BirdWatcher.exe"
            if [ ! -f "$executable" ]; then
              echo "Expected PyInstaller executable not found: $executable" >&2
              exit 1
            fi

            # Inno Setup doesn't like the 'v' in v1.0.0 for AppVersion, so we strip it
            CLEAN_VERSION="${RELEASE_TAG#v}"
            BASENAME=$(basename "$archive" .exe)

            # Dynamically write the Inno Setup Script
            cat <<EOF > installer.iss
            [Setup]
            AppName=BirdWatcher
            AppVersion=$CLEAN_VERSION
            DefaultDirName={autopf}\BirdWatcher
            OutputDir=.
            OutputBaseFilename=$BASENAME
            Compression=lzma
            SolidCompression=yes
            SetupIconFile=assets\icons\icon.ico
            DisableProgramGroupPage=yes

            [Files]
            Source: "dist\BirdWatcher\BirdWatcher.exe"; DestDir: "{app}"; Flags: ignoreversion
            Source: "dist\BirdWatcher\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

            [Icons]
            Name: "{autoprograms}\BirdWatcher"; Filename: "{app}\BirdWatcher.exe"; IconFilename: "{app}\BirdWatcher.exe"
            Name: "{autodesktop}\BirdWatcher"; Filename: "{app}\BirdWatcher.exe"; IconFilename: "{app}\BirdWatcher.exe"; Tasks: desktopicon

            [Tasks]
            Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional icons:"
          EOF

            # Execute Inno Setup Compiler (Pre-installed on GitHub Actions windows-latest)
            iscc installer.iss
            exit 0
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdWatcher-${{ matrix.runner_os }}-${{ runner.arch }}
          path: BirdWatcher-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - resolve-release
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BirdWatcher-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          name: BirdWatcher ${{ needs.resolve-release.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*